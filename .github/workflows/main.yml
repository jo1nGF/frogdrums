name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP from repository root
        shell: bash
        run: |
          echo "Conteúdo inicial da raiz:"
          ls -la "$GITHUB_WORKSPACE"

          zip_file=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$zip_file" ]; then
            echo "Erro: nenhum arquivo .zip foi encontrado na raiz do repositório."
            exit 1
          fi

          echo "Extraindo: $zip_file"
          unzip -o "$zip_file" -d "$GITHUB_WORKSPACE"

          echo "Conteúdo após a extração:"
          ls -la "$GITHUB_WORKSPACE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Gradle project
        shell: bash
        run: |
          settings_file=$(find "$GITHUB_WORKSPACE" -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'settings.gradle.dcl' \) \
            -not -path '*/.gradle/*' -print -quit)

          if [ -z "$settings_file" ]; then
            echo "Erro: settings.gradle não foi encontrado após a extração."
            exit 1
          fi

          project_dir=$(dirname "$settings_file")
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Projeto Gradle encontrado em: $project_dir"

      - name: Build debug + release APK
        run: gradle assembleDebug assembleRelease --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Remove ZIP
        if: always()
        run: find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' -delete

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" dist/BullfrogDrums-debug.apk
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" dist/BullfrogDrums-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BullfrogDrums-apk
          path: dist/*.apk

      - name: Publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
